function updateThemeButton(){

function setTheme(theme){

}
updateThemeButton();

const dlg=document.getElementById("dlg"),body=document.getElementById("body");let cur=1;
function atom(o){const sh={};Object.keys(o).forEach(k=>{sh[k[0]]=(sh[k[0]]||0)+o[k]});let s=`<svg class="atom" viewBox="-85 -85 170 170" aria-hidden="true" fill="none"><circle r="5" fill="var(--c)"/>`;
 Object.entries(sh).forEach(([n,cnt])=>{const r=14+n*13,period=4.8+n*2;s+=`<circle r="${r}" stroke="var(--ink)" stroke-opacity=".35"/><g class="orbit-track" style="--orbit-speed:${period}s">`;for(let j=0;j<cnt;j++){const a=2*Math.PI*j/cnt;s+=`<circle cx="${(r*Math.cos(a)).toFixed(1)}" cy="${(r*Math.sin(a)).toFixed(1)}" r="3.2" fill="var(--c)"/>`}s+="</g>"});return s+"</svg>"}
function openEl(z){cur=z;const e=E[z-1],o=occ(z),ks=sorted(o),u=e.u,c=col(e.c);
 const sh={};ks.forEach(k=>sh[k[0]]=(sh[k[0]]||0)+o[k]);
 let core=[2,10,18,36].filter(x=>x<z).pop(),ng;
 if(!core)ng=fmt(o,ks);else{const co=occ(core),rest=ks.filter(k=>o[k]-(co[k]||0)>0);ng=`[${E[core-1].s}] ${fmt(o,rest)}`}
 const lad=ks.slice().sort((a,b)=>ORD.indexOf(b)-ORD.indexOf(a)).map(k=>{const b=CAP[k[1]]/2,n=o[k];let h="";for(let i=0;i<b;i++)h+=`<span class="box">${i<n?"↑":""}${i<n-b?"↓":""}</span>`;return `<div class="lv"><span>${k}</span><div>${h}</div></div>`}).join("");
 const dots=Array.from({length:Math.max(u,1)},(_,i)=>`<i class="${i<u?"u":""}"></i>`).join("");
 const row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
 body.innerHTML=`<div style="--c:${c}"><div class="dh"><span class="sc">Element data sheet · Z = ${z}</span><button class="x" id="close">Close ✕</button></div>
 <div class="idr"><div class="cell"><span class="z">${z}</span><b>${e.s}</b><small>${e.n}<br>${Object.values(sh).join("-")}</small></div><div style="flex:1;min-width:180px"><h2>${e.n}</h2><p class="fam">${CATS[e.c][0]} · ${e.b}-block</p><p class="note">${e.f}</p></div>${atom(o)}</div>
 <section><h3>1. Identification</h3><table>${row("Name",e.n)}${row("Symbol",e.s)}${row("Atomic number",z)}${row("Group",e.g)}${row("Period",e.p)}${row("Block",e.b)}</table></section>
 <section><h3>2. Electron configuration</h3><span class="cl">Complete electron configuration</span><div class="cfg">${fmt(o,ks)}</div><span class="cl">${z<=2?"Complete notation (no noble-gas core exists)":"Noble-gas notation"}</span><div class="cfg" style="color:var(--c)">${ng}</div></section>
 <section><h3>3. Orbital diagram</h3><div class="ladder"><div class="axis"><span>Energy</span><i></i></div><div class="rows">${lad}</div></div><span class="cl">Subshells are filled from the lowest energy upward; electrons occupy separate orbitals before pairing (Hund's rule).</span></section>
 <section><h3>4. Magnetic classification</h3><div class="mag"><div><strong>${u?"Paramagnetic":"Diamagnetic"}</strong><span>${u} unpaired electron${u==1?"":"s"}</span><div class="dots">${dots}</div></div></div></section>
 <div class="nav"><button id="pv" ${z==1?"disabled":""}>← ${z>1?E[z-2].n:""}</button><span>${z} of 54</span><button id="nx" ${z==54?"disabled":""}>${z<54?E[z].n:""} →</button></div></div>`;
 document.getElementById("pv").onclick=()=>openEl(z-1);document.getElementById("nx").onclick=()=>openEl(z+1);
 document.getElementById("close").onclick=()=>dlg.close();
 if(!dlg.open)dlg.showModal()}
dlg.addEventListener("click",e=>{if(e.target==dlg)dlg.close()});
dlg.addEventListener("keydown",e=>{if(e.key=="ArrowRight"&&cur<54)openEl(cur+1);if(e.key=="ArrowLeft"&&cur>1)openEl(cur-1)});
const animationControls=document.getElementById("animation-controls");
const controlsHome={parent:animationControls.parentNode,next:animationControls.nextElementSibling};
const globeButton=document.getElementById("globe-mode"),meteorButton=document.getElementById("meteor-mode");
let animationStage=null,animationType=null,globeSpin=null,globeStartRects=[],transferAnimations=[],meteorTimers=[],meteorNodes=[];
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function setAnimationButtons(){globeButton.setAttribute("aria-pressed",String(animationType=="globe"));meteorButton.setAttribute("aria-pressed",String(animationType=="meteor"))}
function floatControls(stage){
 animationControls.classList.add("floating");
 stage.append(animationControls);
}
function makeAnimationStage(kind){
 const stage=document.createElement("div");stage.className=`animation-stage ${kind}-stage`;
 document.body.append(stage);floatControls(stage);animationStage=stage;
 requestAnimationFrame(()=>stage.classList.add("visible"));
 return stage;
}
function clearTileMode(){
 transferAnimations.forEach(a=>a.cancel());transferAnimations=[];
 E.forEach(e=>{
  e.node.disabled=false;e.node.classList.remove("globe-tile","fading-out");
  ["left","top","width","height","margin-left","margin-top"].forEach(p=>e.node.style.removeProperty(p));
  delete e.node.dataset.lineTransform;delete e.node.dataset.sphereTransform;
  if(e.node.parentNode!==grid)grid.append(e.node);
 });
}
async function resetAnimations(){
 const stage=animationStage;
 if(!stage&&!animationType)return;
 const returningFromGlobe=!!stage&&animationType=="globe";
 const returningFromMeteors=!!stage&&animationType=="meteor";
 let returnAnimations=[];
 if(returningFromGlobe){
  if(globeSpin){globeSpin.cancel();globeSpin=null}
  const currentRects=E.map(e=>e.node.getBoundingClientRect());
  transferAnimations.forEach(a=>a.cancel());transferAnimations=[];
  E.forEach((e,i)=>{
   const node=e.node,from=currentRects[i],to=globeStartRects[i];
   node.classList.remove("globe-tile");node.classList.add("globe-returning");stage.append(node);
   node.style.left=`${from.left}px`;node.style.top=`${from.top}px`;node.style.width=`${from.width}px`;node.style.height=`${from.height}px`;node.style.marginLeft="0";node.style.marginTop="0";
   returnAnimations.push(node.animate([{left:`${from.left}px`,top:`${from.top}px`,width:`${from.width}px`,height:`${from.height}px`},{left:`${to.left}px`,top:`${to.top}px`,width:`${to.width}px`,height:`${to.height}px`}],{duration:matchMedia("(prefers-reduced-motion: reduce)").matches?1:760,easing:"ease-in-out",fill:"forwards"}));
  });
 }else if(returningFromMeteors){
  if(globeSpin){globeSpin.cancel();globeSpin=null}
  const currentRects=E.map(e=>e.node.getBoundingClientRect());
  transferAnimations.forEach(a=>a.cancel());transferAnimations=[];
  E.forEach(e=>{
   e.node.disabled=false;e.node.classList.remove("falling-tile","fading-out");
   ["left","top","width","height","margin-left","margin-top","--fall-width","--fall-height"].forEach(p=>e.node.style.removeProperty(p));
   grid.append(e.node);
  });
  const targetRects=E.map(e=>e.node.getBoundingClientRect());
  E.forEach((e,i)=>{
   const from=currentRects[i],to=targetRects[i];
   const dx=from.left+from.width/2-(to.left+to.width/2),dy=from.top+from.height/2-(to.top+to.height/2),scale=from.width/to.width;
   returnAnimations.push(e.node.animate([{transform:`translate3d(${dx}px,${dy}px,0) scale(${scale})`,opacity:.75},{transform:"translate3d(0,0,0) scale(1)",opacity:1}],{duration:matchMedia("(prefers-reduced-motion: reduce)").matches?1:720,easing:"ease-in-out",fill:"both"}));
  });
 }else if(globeSpin){globeSpin.cancel();globeSpin=null}
 meteorTimers.forEach(clearTimeout);meteorTimers=[];meteorNodes=[];
 animationType=null;dragState=null;setAnimationButtons();
 if(stage)stage.classList.remove("visible");
 if(returningFromGlobe||returningFromMeteors){
  await Promise.all([...returnAnimations.map(a=>a.finished.catch(()=>{})),wait(matchMedia("(prefers-reduced-motion: reduce)").matches?0:760)]);
  returnAnimations.forEach(a=>a.cancel());
  if(returningFromGlobe){
   E.forEach(e=>{
    const node=e.node;node.classList.remove("globe-returning");node.disabled=false;
    ["left","top","width","height","margin-left","margin-top"].forEach(p=>node.style.removeProperty(p));
    grid.append(node);
   });
   globeStartRects=[];
  }
 }else{
  document.body.classList.add("table-restoring");
  clearTileMode();
 }
 animationControls.classList.remove("floating");
 ["left","top","width"].forEach(p=>animationControls.style.removeProperty(p));
 if(controlsHome.next&&controlsHome.next.parentNode===controlsHome.parent)controlsHome.parent.insertBefore(animationControls,controlsHome.next);
 else controlsHome.parent.append(animationControls);
 if(stage&&!returningFromGlobe&&!returningFromMeteors)await wait(matchMedia("(prefers-reduced-motion: reduce)").matches?0:520);
 if(stage)stage.remove();
 animationStage=null;
 if(!returningFromGlobe&&!returningFromMeteors){
  await wait(matchMedia("(prefers-reduced-motion: reduce)").matches?0:560);
  document.body.classList.remove("table-restoring");
 }
 render();
}
async function startGlobe(){
 if(animationType=="globe"){await resetAnimations();return}
 await resetAnimations();
 animationType="globe";setAnimationButtons();
 const rects=E.map(e=>e.node.getBoundingClientRect());
 globeStartRects=rects;
 const stage=makeAnimationStage("globe");
 const radius=Math.min(innerWidth*.31,innerHeight*.34,290),tileWidth=Math.min(52,Math.max(28,innerWidth*.045)),tileHeight=tileWidth*1.28;
 const lineWidth=Math.min(32,(innerWidth-32)/E.length),lineSpacing=innerWidth/E.length;
 stage.style.setProperty("--globe-diameter",`${radius*2}px`);
 const center=document.createElement("div");center.className="globe-center";
 const spin=document.createElement("div");spin.className="globe-spin";center.append(spin);stage.append(center);
 const goldenAngle=Math.PI*(3-Math.sqrt(5)),cx=innerWidth/2,cy=innerHeight*.54;
 E.forEach((e,i)=>{
  const node=e.node,r=rects[i],y=1-2*(i+.5)/E.length,latitude=Math.asin(y),longitude=i*goldenAngle;
  const dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;
  const from=`translate3d(${dx}px,${dy}px,0) scale(${r.width/tileWidth})`;
  const lineX=(i-(E.length-1)/2)*lineSpacing,line=`translate3d(${lineX}px,0,0) scale(${lineWidth/tileWidth})`;
  const to=`rotateY(${longitude}rad) rotateX(${-latitude}rad) translateZ(${radius}px)`;
  node.classList.add("globe-tile");node.disabled=true;
  node.style.left="50%";node.style.top="50%";node.style.width=`${tileWidth}px`;node.style.height=`${tileHeight}px`;
  node.style.marginLeft=`${-tileWidth/2}px`;node.style.marginTop=`${-tileHeight/2}px`;
  spin.append(node);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  transferAnimations.push(node.animate([{transform:from},{transform:line}],{duration:reduce?1:1000,easing:"ease-in-out",fill:"forwards"}));
  node.dataset.lineTransform=line;node.dataset.sphereTransform=to;
 });
 let spinPointer=null,lastX=0;
 stage.addEventListener("pointerdown",event=>{
  if(event.target.closest(".animation-controls"))return;
  if(!globeSpin)return;
  spinPointer=event.pointerId;lastX=event.clientX;stage.setPointerCapture(event.pointerId);globeSpin.pause();
 });
 stage.addEventListener("pointermove",event=>{
  if(event.pointerId!==spinPointer||!globeSpin)return;
  globeSpin.currentTime=(globeSpin.currentTime||0)+(event.clientX-lastX)*75;lastX=event.clientX;
 });
 const releaseSpin=event=>{if(event.pointerId!==spinPointer)return;spinPointer=null;if(globeSpin&&!matchMedia("(prefers-reduced-motion: reduce)").matches)globeSpin.play()};
 stage.addEventListener("pointerup",releaseSpin);stage.addEventListener("pointercancel",releaseSpin);
 await Promise.all(transferAnimations.map(a=>a.finished.catch(()=>{})));
 if(animationStage!==stage)return;
 transferAnimations=E.map(e=>e.node.animate([{transform:e.node.dataset.lineTransform},{transform:e.node.dataset.sphereTransform}],{duration:matchMedia("(prefers-reduced-motion: reduce)").matches?1:1500,easing:"ease-in-out",fill:"forwards"}));
 await Promise.all(transferAnimations.map(a=>a.finished.catch(()=>{})));
 if(animationStage!==stage)return;
 globeSpin=spin.animate([{transform:"rotateX(-9deg) rotateY(0deg)"},{transform:"rotateX(-9deg) rotateY(360deg)"}],{duration:80000,iterations:Infinity,easing:"linear"});
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)globeSpin.pause();
}
function launchMeteors(stage){
 const baseWidth=Math.max(48,Math.min(76,innerWidth*.055));
 E.forEach((e,i)=>{
  meteorTimers.push(setTimeout(()=>{
   if(animationStage!==stage)return;
   const node=e.node,tileWidth=baseWidth*(.9+Math.random()*.2),tileHeight=tileWidth*1.28;
   const duration=matchMedia("(prefers-reduced-motion: reduce)").matches?1:4000+Math.random()*2000;
   const startX=8+Math.random()*Math.max(0,innerWidth-tileWidth-16),startY=-tileHeight-Math.random()*innerHeight*.35;
   const drift=(Math.random()-.5)*innerWidth*.62,tilt=-18+Math.random()*36;
   node.classList.remove("fading-out");node.classList.add("falling-tile");node.disabled=true;
   node.style.left=`${startX}px`;node.style.top=`${startY}px`;node.style.width=`${tileWidth}px`;node.style.height=`${tileHeight}px`;
   node.style.setProperty("--tail-length",`${70+Math.random()*100}px`);
   stage.append(node);
   const fall=node.animate([
    {transform:`translate3d(0,0,0) rotate(${tilt}deg)`,opacity:1,offset:0},
    {transform:`translate3d(${drift*.32}px,${innerHeight*.38}px,0) rotate(${tilt}deg)`,opacity:1,offset:.36},
    {transform:`translate3d(${drift}px,${innerHeight+tileHeight+180}px,0) rotate(${tilt}deg)`,opacity:0,offset:1}
   ],{duration,easing:"linear",fill:"forwards"});
   transferAnimations.push(fall);fall.finished.catch(()=>{});
  },matchMedia("(prefers-reduced-motion: reduce)").matches?0:i*180));
 });
}
async function startMeteorShow(){
 if(animationType=="meteor"){await resetAnimations();return}
 await resetAnimations();
 animationType="meteor";setAnimationButtons();
 const stage=makeAnimationStage("meteor");
 E.forEach(e=>{e.node.disabled=true;e.node.classList.add("fading-out")});
 meteorTimers.push(setTimeout(()=>{if(animationStage===stage)launchMeteors(stage)},520));
}
globeButton.onclick=startGlobe;meteorButton.onclick=startMeteorShow;
document.getElementById("reset-animation").onclick=resetAnimations;
</script>
