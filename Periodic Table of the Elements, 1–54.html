<main>
<header>
<div><h1>A little universe of elements</h1><p class="lede">Take a tour from hydrogen to xenon. Choose an element to discover what makes it special.</p>

<g font-size="11" fill="currentColor" text-anchor="middle" style="color:var(--mut)"><text x="36" y="92">410</text><text x="64" y="92">434</text><text x="126" y="92">486</text><text x="329" y="92">656 nm</text></g></svg>
<figcaption><b>Fig. 1.</b> Hydrogen's visible emission lines (Balmer series), the experimental evidence behind quantised electron energy levels.</figcaption></figure>
</header>
<div class="chips" id="chips"></div>

   const startX=8+Math.random()*Math.max(0,innerWidth-tileWidth-16),startY=-tileHeight-Math.random()*innerHeight*.35;
   const drift=(Math.random()-.5)*innerWidth*.62,tilt=-18+Math.random()*36;
   node.classList.remove("fading-out");node.classList.add("falling-tile");node.disabled=true;
   node.style.left=`${startX}px`;node.style.top=`${startY}px`;node.style.width=`${tileWidth}px`;node.style.height=`${tileHeight}px`;
   node.style.setProperty("--tail-length",`${70+Math.random()*100}px`);
   stage.append(node);
   const fall=node.animate([
    {transform:`translate3d(0,0,0) rotate(${tilt}deg)`,opacity:1,offset:0},
    {transform:`translate3d(${drift*.32}px,${innerHeight*.38}px,0) rotate(${tilt}deg)`,opacity:1,offset:.36},
    {transform:`translate3d(${drift}px,${innerHeight+tileHeight+180}px,0) rotate(${tilt}deg)`,opacity:0,offset:1}
   ],{duration,easing:"linear",fill:"forwards"});
   transferAnimations.push(fall);fall.finished.catch(()=>{});
  },matchMedia("(prefers-reduced-motion: reduce)").matches?0:i*180));
 });
}
async function startMeteorShow(){
 if(animationType=="meteor"){await resetAnimations();return}
 await resetAnimations();
 animationType="meteor";setAnimationButtons();
 const stage=makeAnimationStage("meteor");
 E.forEach(e=>{e.node.disabled=true;e.node.classList.add("fading-out")});
 meteorTimers.push(setTimeout(()=>{if(animationStage===stage)launchMeteors(stage)},520));
}
globeButton.onclick=startGlobe;meteorButton.onclick=startMeteorShow;
document.getElementById("reset-animation").onclick=resetAnimations;
</script>
